skill: stop-slop
description: |
  Checks that prose cleanup removes recognizable AI-writing patterns without
  flattening the writer's voice, inventing support, or rewriting during a
  detection-only request.
cases:
  - name: minimum_edit_preserves_voice
    prompt: |
      Tighten this note without making it sound corporate or sanding off my voice.
      The first sentence is protected voice text: keep it verbatim and in place.
      Edit the second sentence only if needed:

      Honestly, I still like the weird little pause here - it sounds like me.
      The real problem is that the deploy takes forty minutes and nobody knows why.
    rubric:
      must_mention:
        - "Honestly, I still like the weird little pause here - it sounds like me."
        - "The deploy takes forty minutes and nobody knows why."
      reference_output: |
        Honestly, I still like the weird little pause here - it sounds like me.
        The deploy takes forty minutes and nobody knows why.

        What changed: Cut "The real problem is that" and kept the supported clause as a complete sentence. The protected first sentence remains verbatim and in place.
  - name: detect_without_rewriting
    prompt: |
      Is this AI slop? Detect patterns only and do not rewrite it:

      Here's what nobody tells you: this launch marks a pivotal moment.
      The future isn't coming. It's already here.
    rubric:
      must_not_mention:
        - "I rewrote"
        - "written by AI"
      expectations:
        - "Names each supported pattern, quotes the relevant text, and gives a short corrective direction."

  - name: unsupported_attribution
    prompt: |
      Polish this sentence: "Studies show that our assistant dramatically
      improves productivity, highlighting our commitment to innovation."
    rubric:
      must_not_mention:
        - "Harvard"
        - "Gartner"
        - "McKinsey"
        - "measurably"
      expectations:
        - "Flags or removes the unnamed attribution instead of inventing a source."
        - "Removes importance puffery and superficial analysis without adding unsupported metrics or claims."

  - name: strong_human_sentence_left_alone
    prompt: |
      Remove AI tells but keep any line that already works:

      I missed the train because I went back for the red notebook.
      At the end of the day, this journey underscores the importance of preparation.
    rubric:
      must_not_mention:
        - "worth it"
      expectations:
        - "Leaves the specific first sentence substantially intact."
        - "Deletes the generic second sentence entirely because the draft provides no supported concrete takeaway to replace it."
        - "Does not invent a new motive, conclusion, or lesson about the delay or the notebook."

  - name: clean_draft_returns_unchanged
    prompt: |
      Polish this only if it needs an edit. Returning it unchanged is allowed:

      I caught the 6:40 train because Marta called before I left.
    rubric:
      must_mention:
        - "I caught the 6:40 train because Marta called before I left."
        - "No material edit needed"
      reference_output: |
        I caught the 6:40 train because Marta called before I left.

        What changed: No material edit needed.

  - name: explicit_voice_brief_wins
    prompt: |
      Edit this using my voice brief. I deliberately use "Honestly" and fragments.
      Keep both unless they make the meaning unclear:

      Honestly, the migration failed. Again. We restored the snapshot before lunch.
    rubric:
      must_mention:
        - |-
          Honestly, the migration failed. Again. We restored the snapshot before lunch.
      reference_output: |
        Honestly, the migration failed. Again. We restored the snapshot before lunch.

        What changed: No material edit needed. The explicit voice brief makes "Honestly" and the fragment intentional.

  - name: legitimate_passive_and_three_item_list
    prompt: |
      Tighten this technical note without changing its scientific emphasis:

      Samples were stored at -80 C. We measured latency, throughput, and error rate.
    rubric:
      must_mention:
        - "Samples were stored at -80 C."
        - "latency, throughput, and error rate"
      reference_output: |
        Samples were stored at -80 C. We measured latency, throughput, and error rate.

        What changed: No material edit needed. The passive construction keeps attention on the samples, and all three measurements are required.

  - name: preserve_long_form_structure
    prompt: |
      Remove AI tells while preserving this Markdown structure and every rollback step:

      ## Rollback

      If the health check fails:

      - Restore the snapshot.
      - Re-run the smoke test.

      The operator records the result in the deployment log.
    rubric:
      must_mention:
        - "## Rollback"
        - "- Restore the snapshot."
        - "- Re-run the smoke test."
        - "deployment log"
      reference_output: |
        ## Rollback

        If the health check fails:

        - Restore the snapshot.
        - Re-run the smoke test.

        The operator records the result in the deployment log.

        What changed: No material edit needed. The heading and list encode operational structure.
      expectations:
        - "Preserves the heading, ordered workflow meaning, bullet formatting, and final logging requirement."

  - name: authorship_request_redirects_to_pattern_audit
    prompt: |
      Was this written by ChatGPT? Give me a confidence score:

      Here's what nobody tells you: the future isn't coming. It's already here.
    rubric:
      must_not_mention:
        - "95%"
        - "90%"
        - "80%"
        - "70%"
      reference_output: |
        Textual patterns cannot determine whether ChatGPT wrote this, so I cannot give a defensible confidence score. I can audit the visible patterns instead: "Here's what nobody tells you" is a faux-insight setup, and "the future isn't coming. It's already here" is a formulaic contrast and mic-drop ending. These are editing evidence, not authorship proof.
      expectations:
        - "States that prose patterns cannot determine AI authorship and declines to provide a confidence score."
        - "Redirects to a quoted pattern audit and distinguishes editing evidence from authorship proof."

threshold:
  pass_rate: 1.0
