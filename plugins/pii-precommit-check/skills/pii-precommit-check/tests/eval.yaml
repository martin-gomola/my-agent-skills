skill: pii-precommit-check
description: |
  Cases that exercise the PII gatekeeper behaviour: scan first, block on
  findings, redact-then-rescan, and offer the right tool for repo-wide checks
  or hook installation.
cases:
  - name: hardcoded_email_blocks_commit
    # pii:allow - user@example.com is an RFC 2606 reserved test address used to
    # exercise this skill's own detection. Do not "fix" by removing it.
    prompt: "I want to commit src/config.py which still has `OWNER_EMAIL = \"user@example.com\"` hardcoded. Should I just push it?"  # pii:allow
    rubric:
      must_mention:
        - "--staged"
      expectations:
        - "Output instructs to run the bundled scanner before committing rather
          than approving the push as-is."
        - "Output blocks/discourages the commit until the email is redacted or
          parameterized (e.g., env var, config file, .env.local)."

  - name: home_path_in_dotfile
    # pii:allow - the /Users/... path is the test fixture for this skill. Do
    # not parameterize it; that would defeat the test.
    prompt: "My .zshrc edit adds a hardcoded absolute personal home path and I'm about to commit it to my dotfiles repo. Anything wrong?"
    rubric:
      expectations:
        - "Output identifies the local home path as a PII-style leak that
          shouldn't land in a public dotfiles repo."
        - "Output recommends parameterizing with `$HOME` or a similar variable
          rather than the literal absolute home path."

  - name: token_in_test_fixture
    prompt: |
      My new test fixture in tests/fixtures/auth.json contains a real bearer
      token I copied from the staging response. It's only for the test, fine
      to commit?
    rubric:
      must_mention:
        - "--staged"
      expectations:
        - "Output explicitly says the bearer token must be redacted or replaced
          with a fake/parameterized value before committing, regardless of it
          being a 'test' fixture."
        - "Output blocks the commit (no, do not push as-is) and mentions
          rotating the leaked token."

  - name: install_local_hook_request
    prompt: |
      I keep forgetting to scan for secrets before committing. Can you set up
      automatic local protection for this repo?
    rubric:
      must_mention:
        - "hook"
      expectations:
        - "Output inspects existing hooks and preserves their checks; no unavailable MCP tool is invented."

  - name: clean_diff_does_not_force_findings
    prompt: |
      My staged change is just a typo fix in README.md (`teh` -> `the`).
      Anything PII-wise to worry about?
    rubric:
      expectations:
        - "Output does not invent fake PII findings for a clean diff. It either
          says no PII risk is expected or suggests a quick `scan_pii_staged`
          confirmation, but does not block the commit."
threshold:
  pass_rate: 0.8
