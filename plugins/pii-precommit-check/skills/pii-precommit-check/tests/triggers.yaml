skill: pii-precommit-check
# Real-prompt fixtures mined from agent-transcripts.
# Real corpus rarely has explicit "scan PII before commit" requests (the user
# runs `make precommit` directly), but is FULL of infra/secrets-manager
# discussions that this skill must NOT match. The negative examples below are
# the most valuable part of this fixture - they catch the FPR risk.
should_trigger:
  - "Scan my staged files for PII before I commit"
  - "Are there any secrets in the diff I'm about to push?"
  - "Check for hardcoded emails or tokens in this commit"
  - "Run a PII pre-commit scan on the repo"
  - "Make sure no auth files are staged"
  - "Install local pre-commit protection for this repo"
  - "Did I leave any absolute personal home paths in the diff?"
  - "lint my staged changes for secrets before push"
  - "did I leak any tokens in this PR?"
  - "check the diff for hardcoded creds"
  - "before commit, scan for PII in the changes"
  - "any auth tokens accidentally added to my last commit?"
should_not_trigger:
  # Real infrastructure-secrets discussions from transcripts. These mention
  # "secret" / "secret manager" / credentials but are NOT precommit scans.
  - "but that is aslo fix for The key AIRFLOW__WEBSERVER__SECRET_KEY exists in AWS Secrets Manager"
  - "we shoudl move exponea connection to secrete manager"
  - "can we just create secrete on staging ?"
  - "yes we have AIRFLOW__SMTP__SMTP_PASSWORD in secrete manager"
  - "@values.yaml should we move more to secrete manager or is it bettr practise to keep it here ?"
  - "would this minimal uv help us with the litellm supply-chain attack on PyPI?"
  - "how do I rotate our API tokens in production?"
  - "set up the GH Actions repo secret AWS_SECRET_ACCESS_KEY"  # pii:allow
  - "design the auth flow for the new app"
  - "Format this Python file"
  - "Send a Gmail to my team"
  - "Schedule a meeting tomorrow"
  - "Refactor this React hook"
  - "Find dead code in src/"
  - "Open this URL in a browser"
  - "Help me design a new auth flow"
threshold:
  min_tpr: 0.85
  max_fpr: 0.1
