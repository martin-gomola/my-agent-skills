skill: ask
should_trigger:
  - "Ask Claude for a second opinion on this architecture choice and save the result"
  - "Use Claude CLI to review this plan and keep the output as an artifact"
  - "Ask Gemini to brainstorm alternate UX directions"
  - "Use Antigravity CLI for a Gemini critique of this roadmap"
  - "Get another model's take on this bug report and preserve the notes"
  - "Run $ask claude to challenge these assumptions"
  - "Run $ask gemini to review this proposal"
  - "Ask Anthropic whether this refactor is worth it"
  - "Ask Claude to review the uncommitted changes as a pre-commit quality gate"
  - "Have Gemini critique PLAN.md without modifying anything"
should_not_trigger:
  - "Explain this architecture choice yourself"
  - "Format this TOML file"
  - "Rename this helper function"
  - "Look up the latest package changelog"
  - "Use our internal MCP server"
  - "Run pytest"
  - "Summarize this PDF yourself"
  - "Implement the approved refactor"
threshold:
  min_tpr: 0.85
  max_fpr: 0.1
