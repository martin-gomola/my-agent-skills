schema_version: 1
skill: what-to-ask
claims:
  - id: direct-action
    instruction: "Start with a direct action and outcome."
    source_ids: [dev-prompts-method]
    evidence: "Prompt Engineering, February 2025, pp. 55-56: favor a clear action verb and a specific task; the source emphasizes the command as the key prompt component."
  - id: only-useful-context
    instruction: "Include only the fields that matter for this task."
    source_ids: [dev-prompts-method]
    evidence: "Prompt Engineering, February 2025, pp. 55-56: use immediate task-specific context and avoid unnecessary information."
  - id: verifiable-success
    instruction: "Include an observable way to check the result."
    source_ids: [dev-prompts-method]
    evidence: "Agents Companion, February 2025, contract data model, pp. 47-50: define acceptable deliverables and how to verify them; Anthropic Building Effective AI Agents describes tests and environment feedback as useful for coding tasks."
  - id: no-forced-boilerplate
    instruction: "Keep it as short as the task allows; do not force a role, chain-of-thought, examples, or rigid section count unless the task benefits from it."
    source_ids: [dev-prompts-method]
    evidence: "Workspace with Gemini prompting guide says its prompt components are optional per task; Prompt Engineering distinguishes role prompting from the task and context. Avoiding chain-of-thought and fixed section counts is the skill's simplicity adaptation, not a universal rule claimed by the sources."
