skill: github-repo-site
should_trigger:
  - "Sprav mi GitHub stránku pre tento repozitár, aby ľudia pochopili, čo robí a ako začať."
  - "Create a GitHub Pages landing page for this CLI tool."
  - "Our project site on github.io is outdated; refresh it from the current README."
  - "Make a homepage for my library that I can link from the repo description."
  - "Publish my repository of SKILL.md skills as an installer page on GitHub Pages."
  - "I added a new skill; update the install page so people can select it."
should_not_trigger:
  - "Set up a multi-page documentation site with MkDocs."
  - "Write a blog post announcing our new release."
  - "Deploy this Next.js app to Vercel."
  - "Improve the README of this repository."
  - "Install the stop-slop skill in Cursor for me."
  - "Design a marketing website for my startup idea."
threshold:
  min_tpr: 0.9
  max_fpr: 0.1
