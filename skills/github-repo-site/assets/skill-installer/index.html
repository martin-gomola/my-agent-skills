<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Choose skills and coding agents, then copy one install command.">
<title>Choose your skills</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="install.mjs"></script>
<body>
<header><a id="repository" href="#">GitHub</a></header>
<main>
  <h1 id="title">Choose your skills</h1>
  <div class="workspace">
    <section class="choices" aria-label="Setup">
      <fieldset>
        <legend>1. Skills</legend>
        <div id="skills" class="options"><p>Loading skills…</p></div>
      </fieldset>
      <fieldset>
        <legend>2. Coding agents</legend>
        <div class="options">
          <label><input type="checkbox" name="agent" value="codex"><span>Codex</span></label>
          <label><input type="checkbox" name="agent" value="claude"><span>Claude Code</span></label>
          <label><input type="checkbox" name="agent" value="cursor"><span>Cursor</span></label>
          <label><input type="checkbox" name="agent" value="antigravity"><span>Antigravity CLI</span></label>
          <label><input type="checkbox" name="agent" value="gemini"><span>Gemini CLI</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>3. Make skills available in</legend>
        <div class="options">
          <label><input type="radio" name="scope" value="project" checked><span>One project<small>Run from your project folder.</small></span></label>
          <label><input type="radio" name="scope" value="global"><span>All my projects<small>Every project on this computer.</small></span></label>
        </div>
      </fieldset>
    </section>
    <section class="result" aria-labelledby="result-title">
      <div class="result-heading">
        <h2 id="result-title">Install</h2>
        <button id="copy" type="button" disabled>Copy command</button>
      </div>
      <p id="where" role="status">Choose skills and agents to get your install command.</p>
      <div id="install-content" hidden>
        <pre id="commands" tabindex="0" aria-label="Install command"></pre>
        <p class="help">Requires <a href="https://nodejs.org/en/download">Node.js 22.20+</a> and Git. Review the installer prompts before confirming.</p>
        <details><summary>Try your skills in chat</summary><div id="examples"></div></details>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </div>
</main>
</body></html>
